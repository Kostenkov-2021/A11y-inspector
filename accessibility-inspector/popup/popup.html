<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Проверка доступности</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header role="banner">
      <h1>Инспектор доступности</h1>
    </header>
    
    <main role="main">
      <div class="input-group">
        <label for="url-input" class="required">URL-адрес сайта:</label>
        <input 
          type="url" 
          id="url-input" 
          placeholder="https://example.com"
          aria-required="true"
          aria-describedby="url-help"
        >
        <div id="url-help" class="help-text">
          Введите полный URL-адрес сайта для проверки доступности
        </div>
      </div>
      
      <div class="input-group">
        <label for="format-select">Формат отчёта:</label>
        <select id="format-select" aria-describedby="format-help">
          <option value="json">JSON</option>
          <option value="html">HTML</option>
          <option value="text">Текст</option>
          <option value="markdown">Markdown</option>
        </select>
        <div id="format-help" class="help-text">
          Выберите формат загрузки отчёта 
        </div>
      </div>
      
      <label class="scenario-option" for="scenario-checks">
        <input type="checkbox" id="scenario-checks">
        Сценарная проверка фокуса и адаптации
      </label>

      <div class="input-group">
        <label for="profile-select">Профиль:</label>
        <select id="profile-select">
          <option value="combined">WCAG 2.2 и ГОСТ Р 52872-2019</option>
          <option value="wcag22">WCAG 2.2</option>
          <option value="gost2019">ГОСТ Р 52872-2019</option>
        </select>
      </div>
      <div class="input-group">
        <label for="level-select">Уровень проверок:</label>
        <select id="level-select"><option value="AA">A и AA</option><option value="AAA">A, AA и доступные проверки AAA</option></select>
      </div>
      <details>
        <summary>Пользовательский сценарий</summary>
        <label for="workflow-input">Сценарий JSON:</label>
        <textarea id="workflow-input" rows="5" spellcheck="false"></textarea>
        <label class="scenario-option"><input type="checkbox" id="workflow-consent">Разрешить действия указанного сценария</label>
      </details>

      <div class="button-group">

        <button id="check-btn" class="primary-btn" aria-live="polite">
          <span class="button-text">Проверить доступность</span>
          <span class="loading-spinner hidden" aria-hidden="true"></span>
        </button>
        
       
      </div>
      
      <div id="status" 
           class="status" 
           role="status" 
           aria-live="polite" 
           aria-atomic="true">
      </div>
      
      <section id="results" class="results hidden" aria-labelledby="results-heading">
        <h2 id="results-heading">Результаты проверки</h2>
        
        <div class="summary-stats" id="summary-stats"></div>
        
        <div class="report-actions">
          <button id="download-btn" class="secondary-btn">
            Скачать отчёт
          </button>
          <button id="copy-btn" class="secondary-btn">
            Скопировать в буфер обмена
          </button>
        </div>
        <button id="open-report" class="primary-btn" style="width: -webkit-fill-available;"> Просмотреть отчёт </button>
        <!--<div id="report-content" class="report-content"></div>-->
      </section>
    </main>
    
    <footer role="contentinfo" class="footer">
      <p>Инспектор доступности v1.1</p>
    </footer>
  </div>
  
  <script src="../utils/doka-links.js"></script>
  <script src="../utils/report-coverage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
